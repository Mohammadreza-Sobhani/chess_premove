name: chess_premove
description: A high-performance, asynchronous chess premove intelligence and validation package. Eliminates race conditions and UI freezing.
version: 1.0.0
repository: https://github.com/Mohammadreza-Sobhani/chess_premove
homepage: https://github.com/Mohammadreza-Sobhani/chess_premove
issue_tracker: https://github.com/Mohammadreza-Sobhani/chess_premove/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # The underlying chess logic engine
  chess: ^0.8.1

dev_dependencies:
  # Standard testing for pure Dart packages
  test: ^1.24.0
  # Standard linting rules for Dart
  lints: ^5.0.0

screenshots:
  - description: 'Calculated premove destination targets highlighted on the board'
    path: doc/premove_logic_result.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Note: The Flutter section (assets, fonts, etc.) has been intentionally removed 
# to make this a "Pure Dart Package". This ensures maximum compatibility across 
# all platforms (Mobile, Web, Desktop, and Server) and grants the highest 
# possible score on pub.dev.